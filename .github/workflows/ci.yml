name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/validate-seed.mjs
      # Deterministic regression suite for the Find-by-Goal pipeline.
      # Provider calls are mocked; the live provider check is NOT here —
      # it stays opt-in (GOAL_LIVE_CHECK=1) so CI never spends provider
      # credits or flakes on provider latency.
      - run: pnpm test:goal
      - run: pnpm lint
      - run: pnpm tsc --noEmit
      - run: pnpm build
